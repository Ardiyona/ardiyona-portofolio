name: CI/CD Auto Deploy Laravel & React (Build di VPS)

on:
  push:
    branches:
      - main

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest

    steps:
    - name: Hubungi VPS via SSH & Jalankan Perintah Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        script: |
          echo "🚀 Memulai proses deployment otomatis..."
          
          # 1. Masuk ke folder repository utama
          cd /var/www/ardiyona-portofolio
          
          # 2. Tarik kode terbaru dari GitHub
          sudo -u www-data git pull origin main
          
          # 3. PROSES FRONTEND (FE)
          cd frontend
          echo "📦 Menginstall dependencies frontend..."
          sudo -u www-data npm install --no-audit --no-fund
          
          echo "🏗️ Memulai compile React statis (Dibatasi RAM 512MB)..."
          # Perintah di bawah membatasi Node.js agar hanya boleh memakai RAM maksimal 512MB
          # Sisa beban lainnya akan ditampung dengan aman oleh SWAP 2GB Anda
          sudo -u www-data NODE_OPTIONS="--max-old-space-size=512" npm run build
          
          # 4. PROSES BACKEND (BE)
          cd ../backend
          echo "⚙️ Mengoptimasi backend Laravel..."
          # Menjalankan composer sebagai www-data juga akan menghilangkan warning "Do not run Composer as root" yang tadi muncul!
          sudo -u www-data composer install --no-dev --optimize-autoloader
          
          # Jalankan perintah Laravel sebagai www-data agar file cache bisa ditulis oleh server
          sudo -u www-data php artisan migrate --force
          sudo -u www-data php artisan config:cache
          sudo -u www-data php artisan route:cache
          sudo -u www-data php artisan view:cache
          
          echo "🎉 Deployment selesai dengan aman dan hak akses file yang rapi!"